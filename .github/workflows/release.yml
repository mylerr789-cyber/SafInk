name: Release
on:
  push:
    tags: ['v*']
  # Deneme: bir dalda elle çalıştırılınca "linux-test" adlı TASLAK yayın oluşturur (yayımlanmaz; işten sonra silinir).
  workflow_dispatch:
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'linux-test' }}
jobs:
  release:
    strategy:
      fail-fast: false
      # Sırayla: ikinci iş, birincinin oluşturduğu taslak yayını bulup latest.json'a kendi platformunu ekler
      # (aynı anda çalışırsa iki taslak ya da ezilen latest.json oluşabilir).
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-24.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Tauri Linux önkoşulları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm --prefix ui ci
      - name: Sürüm notlarını CHANGELOG.md'den al
        id: notes
        shell: pwsh
        run: |
          $v = "${{ env.RELEASE_TAG }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\][^`n]*`n(.*?)(?=^## \[|\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "SafInk $v" }
          $body += "`n`n---`nWindows: SafInk_*_x64-setup.exe. SmartScreen uyarırsa: Ek bilgi > Yine de çalıştır / More info > Run anyway."
          $body += "`nLinux (deneysel / experimental): SafInk_*_amd64.AppImage (chmod +x) veya SafInk_*_amd64.deb (sudo apt install ./SafInk_*.deb). Gerekli / requires: webkit2gtk-4.1, glibc 2.38+ (Ubuntu 24.04+)."
          "body<<SAFINK_EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "SAFINK_EOF" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'SafInk ${{ env.RELEASE_TAG }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
