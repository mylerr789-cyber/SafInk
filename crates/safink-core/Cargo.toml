[package]
name = "safink-core"
version.workspace = true
edition.workspace = true

[features]
default = []
cuda = ["ort/cuda"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "process", "macros", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "stream", "json"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
sha2 = "0.10"
hex = "0.4"
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
parking_lot = "0.12"

[dev-dependencies]
anyhow = "1"

[target.'cfg(windows)'.dependencies]
# DirectML'li ONNX Runtime derlemesi yalnızca Windows'ta vardır; Linux'ta varsayılan CPU derlemesi indirilir.
ort = { version = "2.0.0-rc.10", features = ["ndarray", "directml"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Gizli bilgi: Secret Service (zbus, libdbus gerekmez); yoksa dosya yedeği (api.rs).
keyring = { version = "3", features = ["async-secret-service", "crypto-rust"] }
libc = "0.2"
